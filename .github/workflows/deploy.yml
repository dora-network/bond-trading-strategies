name: Deploy

on:
  push:
    branches:
      - development
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-bond-trading-${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'staging' || (startsWith(github.ref, 'refs/tags/') && 'prod' || 'dev')) }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  REPOSITORY: dora-bond-trading-strategies
  DEPLOY_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'staging' || (startsWith(github.ref, 'refs/tags/') && 'prod' || 'dev')) }}

jobs:
  deploy:
    name: Build and deploy ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'staging' || (startsWith(github.ref, 'refs/tags/') && 'prod' || 'dev')) }}
    if: github.event_name == 'workflow_dispatch' || github.ref_name == 'development' || github.ref_name == 'main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'staging' || (startsWith(github.ref, 'refs/tags/') && 'prod' || 'dev')) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify prod deploy targets main
        if: env.DEPLOY_ENVIRONMENT == 'prod'
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF_NAME" != "main" ]]; then
            echo "::error::Manual prod deploys are only allowed from the main branch (got $GITHUB_REF_NAME)." >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/* ]]; then
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Tag $GITHUB_REF_NAME (commit $GITHUB_SHA) is not reachable from origin/main. Prod deploys must target a commit on main." >&2
              exit 1
            fi
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ENVIRONMENT == 'prod' && 'arn:aws:iam::425946675752:role/dora-bond-trading-prod-github-actions-role' || 'arn:aws:iam::425946675752:role/dora-bond-trading-github-actions-role' }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-bond-trading-${{ env.DEPLOY_ENVIRONMENT }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        shell: bash
        env:
          IMAGE_TAG: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/build-push.sh

      - name: Deploy ECS services
        shell: bash
        env:
          ENVIRONMENT: ${{ env.DEPLOY_ENVIRONMENT }}
          IMAGE_TAG: ${{ github.sha }}
          DORA_API_KEY: ${{ secrets.DORA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: bash .github/scripts/deploy.sh
